<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="common.css">
  <style>
    body { width: 300px; height: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .brand { margin-bottom: 4px; }
    .btn { width: 100%; justify-content: flex-start; }
    .stat { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; padding: 0 2px; }
    .stat b { color: var(--text); }
    .sw { display: flex; align-items: center; justify-content: space-between; color: var(--text-2); padding: 4px 2px; }
  </style>
</head>
<body>
  <div class="brand"><img src="../icons/icon48.png" alt=""><span>Chess <b>Analyzer</b></span></div>
  <button class="btn btn-primary" id="cur" hidden data-icon="bolt">Analyser cette partie</button>
  <button class="btn" id="analyze" data-icon="search">Analyser une partie / PGN</button>
  <button class="btn" id="puzzles" data-icon="puzzle">Puzzles</button>
  <button class="btn" id="openings" data-icon="book">Ouvertures</button>
  <button class="btn" id="explore" data-icon="board">Plateau libre + Stockfish</button>
  <button class="btn" id="options" data-icon="gear">Paramètres</button>
  <label class="sw">Remplacer le bilan chess.com <input type="checkbox" class="toggle" id="intercept"></label>
  <div class="stat"><span>Puzzles : <b id="np">0</b></span><span>Classement : <b id="pr">1200</b></span></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
